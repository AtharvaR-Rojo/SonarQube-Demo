name: Sync SAP CPI artifacts for SonarQube

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Integration package - technical ID or display name"
        required: true
        type: string
      artifact:
        description: "Integration flow - ID or display name (leave blank for the whole package)"
        required: false
        type: string

permissions:
  contents: write

env:
  # --- repository variables (Settings > Secrets and variables > Actions > Variables) ---
  CPI_API_BASE: ${{ vars.CPI_API_BASE }}      # e.g. https://<tenant>.it-cpi0XX.cfapps.<region>.hana.ondemand.com/api/v1
  CPI_TOKEN_URL: ${{ vars.CPI_TOKEN_URL }}    # e.g. https://<subdomain>.authentication.<region>.hana.ondemand.com/oauth/token
  TARGET_DIR: cpi                             # where filtered artifacts land in the repo

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq unzip

      - name: Request OAuth token
        id: auth
        run: |
          set -euo pipefail

          # Credentials come from the service key of the Process Integration Runtime
          # instance (plan: api). Never hard-code them here.
          TOKEN=$(curl -sS -f -X POST "$CPI_TOKEN_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${{ secrets.CPI_CLIENT_ID }}" \
            --data-urlencode "client_secret=${{ secrets.CPI_CLIENT_SECRET }}" \
            | jq -r '.access_token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to obtain an access token."
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Resolve package and artifact
        id: resolve
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          IN_PACKAGE: ${{ inputs.package }}
          IN_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail

          AUTH=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/json")

          # --- resolve the package: the API path needs the technical Id, but the
          # user may have typed the display name, so match on either. ---
          curl -sS -f "${AUTH[@]}" "$CPI_API_BASE/IntegrationPackages" > packages.json

          PKG_ID=$(jq -r --arg q "$IN_PACKAGE" \
            '[.d.results[] | select(.Id == $q or .Name == $q) | .Id] | first // empty' packages.json)

          if [ -z "$PKG_ID" ]; then
            echo "::error::No package matches '$IN_PACKAGE'. Available packages:"
            jq -r '.d.results[] | "  \(.Id)  (\(.Name))"' packages.json
            exit 1
          fi
          echo "Package resolved: $PKG_ID"

          # --- list the artifacts in that package ---
          curl -sS -f "${AUTH[@]}" \
            "$CPI_API_BASE/IntegrationPackages('$PKG_ID')/IntegrationDesigntimeArtifacts" \
            > artifacts.json

          if [ -n "$IN_ARTIFACT" ]; then
            IDS=$(jq -r --arg q "$IN_ARTIFACT" \
              '[.d.results[] | select(.Id == $q or .Name == $q) | .Id] | .[]' artifacts.json)

            if [ -z "$IDS" ]; then
              echo "::error::No artifact matches '$IN_ARTIFACT' in package $PKG_ID. Available:"
              jq -r '.d.results[] | "  \(.Id)  (\(.Name))"' artifacts.json
              exit 1
            fi
            echo "scope=artifact" >> "$GITHUB_OUTPUT"
          else
            IDS=$(jq -r '.d.results[].Id' artifacts.json)

            if [ -z "$IDS" ]; then
              echo "::warning::Package $PKG_ID contains no integration artifacts."
            fi
            echo "scope=package" >> "$GITHUB_OUTPUT"
          fi

          echo "Artifacts to sync:"
          echo "$IDS" | sed 's/^/  /'

          echo "package_id=$PKG_ID" >> "$GITHUB_OUTPUT"
          {
            echo "artifact_ids<<EOF"
            echo "$IDS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download and filter artifacts
        env:
          TOKEN: ${{ steps.auth.outputs.token }}
          PKG_ID: ${{ steps.resolve.outputs.package_id }}
          SCOPE: ${{ steps.resolve.outputs.scope }}
          ARTIFACT_IDS: ${{ steps.resolve.outputs.artifact_ids }}
        run: |
          set -euo pipefail

          WORK=$(mktemp -d)
          DEST="$TARGET_DIR/$PKG_ID"

          # Whole-package runs rebuild the folder so artifacts deleted in the
          # tenant also disappear from the repo. Single-artifact runs must only
          # touch their own subfolder, or they would wipe their siblings.
          if [ "$SCOPE" = "package" ]; then
            rm -rf "$DEST"
          fi
          mkdir -p "$DEST"

          # Extensions SonarQube's XML analyser can read, plus the manifest for
          # reference. Keep this list in sync with sonar.xml.file.suffixes.
          KEEP_EXT="iflw xml xsd xsl mmap prop propdef wsdl edmx"
          KEEP_NAMES="MANIFEST.MF"

          for ID in $ARTIFACT_IDS; do
            echo "--- $ID"

            ZIP="$WORK/$ID.zip"
            if ! curl -sS -f -H "Authorization: Bearer $TOKEN" \
                 "$CPI_API_BASE/IntegrationDesigntimeArtifacts(Id='$ID',Version='active')/\$value" \
                 -o "$ZIP"; then
              echo "::warning::Download failed for $ID, skipping."
              continue
            fi

            RAW="$WORK/raw/$ID"
            mkdir -p "$RAW"
            if ! unzip -qq -o "$ZIP" -d "$RAW"; then
              echo "::warning::$ID is not a readable zip, skipping."
              continue
            fi

            # Replace this artifact's folder so renamed or deleted files inside
            # it do not linger.
            rm -rf "$DEST/$ID"

            FOUND=0
            while IFS= read -r -d '' FILE; do
              REL="${FILE#$RAW/}"
              mkdir -p "$DEST/$ID/$(dirname "$REL")"
              cp "$FILE" "$DEST/$ID/$REL"
              FOUND=$((FOUND + 1))
            done < <(
              find "$RAW" -type f \( \
                $(for E in $KEEP_EXT; do printf -- '-iname *.%s -o ' "$E"; done) \
                $(for N in $KEEP_NAMES; do printf -- '-name %s -o ' "$N"; done) \
                -false \
              \) -print0
            )

            echo "    kept $FOUND file(s)"
          done

          rm -rf "$WORK"

          echo "Result:"
          find "$DEST" -type f | sort

      - name: Commit changes
        env:
          PKG_ID: ${{ steps.resolve.outputs.package_id }}
          IN_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail

          git config user.name "cpi-sync[bot]"
          git config user.email "cpi-sync@users.noreply.github.com"
          git add -A "$TARGET_DIR"

          if git diff --cached --quiet; then
            echo "No artifact changes to commit."
            exit 0
          fi

          SCOPE_MSG="${IN_ARTIFACT:-all artifacts}"
          git commit -m "chore(cpi): sync $SCOPE_MSG from package $PKG_ID"
          git push
